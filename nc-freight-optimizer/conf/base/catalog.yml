# Northern Cape Freight Optimizer -- Data Catalog
#
# Layer convention (Kedro standard):
#   01_raw          untouched extraction output
#   02_intermediate cleaned/validated but not yet the final modelling artifact
#   03_primary      the artifacts live_backend.py and notebooks actually consume
#   08_reporting    outputs meant to be read by a human (CSV, charts)
#
# GeoDataFrames and networkx graphs are stored as pickle.PickleDataset rather than
# GeoParquet/GraphML: pickle round-trips geometry and graph objects exactly, and
# avoids fighting kedro-datasets' fiona-based GenericDataset over parquet driver
# support. Every pickle here is produced by this project's own pipeline, not
# downloaded from an untrusted source.

raw_roads:
  type: pickle.PickleDataset
  filepath: data/01_raw/extracted_full_roads.pkl
  # Produced by extract_raw_roads_node (downloads from Geofabrik) -- no longer a
  # manually-placed file. Delete this and re-run `kedro run` to confirm it
  # regenerates from nothing but internet access.

validated_roads:
  type: pickle.PickleDataset
  filepath: data/02_intermediate/validated_roads.pkl

cleaned_roads:
  type: pickle.PickleDataset
  filepath: data/02_intermediate/cleaned_roads.pkl

speed_lookup:
  type: pickle.PickleDataset
  filepath: data/02_intermediate/speed_lookup.pkl

road_graph_full:
  type: pickle.PickleDataset
  filepath: data/03_primary/road_graph_full.pkl

cluster_coord:
  type: pickle.PickleDataset
  filepath: data/03_primary/cluster_coord.pkl

road_graph_main:
  type: pickle.PickleDataset
  filepath: data/03_primary/road_graph_main.pkl

main_nodes:
  type: pickle.PickleDataset
  filepath: data/03_primary/main_nodes.pkl

# The combined bundle apps/live_backend.py loads at startup -- same shape as the
# nc_road_graph.pkl produced by the earlier notebook-based pipeline, so the live
# apps don't need to change how they read it, only where.
nc_road_graph_bundle:
  type: pickle.PickleDataset
  filepath: data/03_primary/nc_road_graph.pkl

route_sensitivity_scan:
  type: pandas.CSVDataset
  filepath: data/08_reporting/route_sensitivity_scan.csv
