# Conda-style environment spec, kept alongside pyproject.toml for teams that
# prefer conda/mamba over uv. pyproject.toml (via `pip install -e .`) is the
# authoritative dependency list; keep this in sync if you add a package there.
name: nc_freight_optimizer
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - kedro~=1.5.0
      - kedro-datasets[pandas,pickle]
      - geopandas
      - networkx
      - numpy
      - pandas
      - pyproj
      - scipy
      - fastapi
      - uvicorn
      - pydantic
      - streamlit
      - streamlit-folium
      - folium
      - requests
      - jupyterlab
      - pytest
      - pytest-cov
      - pytest-mock
